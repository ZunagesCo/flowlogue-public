name: Release Apple Notes Exporter

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]

      - name: Build release archive
        shell: bash
        run: |
          chmod +x scripts/build-apple-notes-exporter-release.sh
          scripts/build-apple-notes-exporter-release.sh "$GITHUB_REF_NAME"

      - name: Verify package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          unzip -l "dist/AppleNotesExporter-$VERSION.zip"
          rm -rf /tmp/apple-notes-exporter-release-check
          mkdir -p /tmp/apple-notes-exporter-release-check
          unzip -q "dist/AppleNotesExporter-$VERSION.zip" -d /tmp/apple-notes-exporter-release-check
          test -x "/tmp/apple-notes-exporter-release-check/Apple Notes Exporter/Install.command"
          test "$(cat "/tmp/apple-notes-exporter-release-check/Apple Notes Exporter/VERSION")" = "$VERSION"
          cp "dist/AppleNotesExporter-$VERSION.zip" "dist/AppleNotesExporter-latest.zip"
          cmp "dist/AppleNotesExporter-$VERSION.zip" "dist/AppleNotesExporter-latest.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/AppleNotesExporter-$VERSION.zip" \
            "dist/AppleNotesExporter-latest.zip" \
            --title "Apple Notes Exporter $VERSION" \
            --generate-notes
